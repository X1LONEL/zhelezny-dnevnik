<header class="top">
  <div class="top-in">
    <div class="brandrow">
      <div class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" class="ico"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg></span>
        <div>
          <h1>Железный дневник</h1>
          <span class="sub" id="cycleName">Full Body</span>
        </div>
      </div>
      <div class="topmeta">
        <span class="chip" id="chipWeek">Неделя 1</span>
        <span class="chip hide-s" id="chipStreak">Серия 0</span>
        <span class="savestate" id="saveState"></span>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Разделы">
      <button class="tab" role="tab" id="tab-train" aria-selected="true" aria-controls="p-train">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></svg>Тренировка</button>
      <button class="tab" role="tab" id="tab-log" aria-selected="false" aria-controls="p-log">

      <button class="tab" role="tab" id="tab-prog" aria-selected="false" aria-controls="p-prog">

      <button class="tab" role="tab" id="tab-food" aria-selected="false" aria-controls="p-food">

      <button class="tab" role="tab" id="tab-plan" aria-selected="false" aria-controls="p-plan">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3.5h10l4 4v13H5z"/><path d="M14.5 3.5v4.5H19M8.5 12.5h7M8.5 16.5h7"/></svg>Программа</button>
    </nav>
  </div>
</header>
